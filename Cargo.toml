[workspace]
resolver = "2"
members = [
    "src/analysis/crates/core",
    "src/analysis/crates/cli",
    "src/dedup/crates/core",
    "src/dedup/crates/cli",
    "src/export",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
ahash = "0.8"
arrow-array = "57.3.1"
arrow-cast = "57.3.1"
arrow-schema = "57.3.1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4.6", features = ["derive"] }
csv = "1.3"
ctrlc = "3.4"
futures-util = "0.3"
getrandom = "0.3"
httpmock = "0.7"
httpdate = "1"
num-bigint = "0.4"
parquet = { version = "=57.3.1", features = ["arrow"] }
postgres = "0.19"
rapidfuzz = "=0.5.0"
rayon = "1.11"
regex = "1.13"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
sha2 = "0.11"
tempfile = "3.27"
thiserror = "2.0"
tokio = { version = "1.52", features = ["macros", "rt-multi-thread", "sync", "time"] }
unicode-normalization = "0.1"
url = "2"
zstd = "0.13"

analysis_core = { path = "src/analysis/crates/core" }
dedup_core = { path = "src/dedup/crates/core" }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.dedup-release]
inherits = "release"
lto = "fat"
